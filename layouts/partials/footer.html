<footer class="site-footer">
  <hr>
  <nav aria-label="Footer links">
    {{ range $index, $item := .Site.Menus.footer }}
      {{ if $index }}<span class="nav-separator" aria-hidden="true">&middot;</span>{{ end }}
      <a href="{{ $item.URL }}">{{ $item.Name }}</a>
    {{ end }}
  </nav>
</footer>
