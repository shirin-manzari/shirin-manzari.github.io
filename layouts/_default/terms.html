{{ define "main" }}
<section class="list-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="plain-list term-list">
    {{ range .Data.Terms.Alphabetical }}
      <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="muted">({{ .Count }})</span></li>
    {{ end }}
  </ul>
</section>
{{ end }}
